<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Rakshak{% endblock %}</title>
<style>
  :root{--bg:#0f1419;--panel:#171d25;--line:#2a3441;--text:#d8e0ea;--muted:#8796a8;--accent:#4aa3ff;
        --low:#3fb68b;--medium:#e0b341;--high:#f0803c;--critical:#ef4d5b}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
  header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline}
  header a{color:var(--text);text-decoration:none;font-weight:700;letter-spacing:.08em} header span{color:var(--muted)}
  main{max-width:1100px;margin:0 auto;padding:24px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 10px}
  .panel>h2:first-child{margin-top:0}
  table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  a{color:var(--accent)} pre{background:#0b0f14;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-word}
  .sev{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;color:#0b0f14}
  .sev.low{background:var(--low)}.sev.medium{background:var(--medium)}.sev.high{background:var(--high)}.sev.critical{background:var(--critical)}
  .tag{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);margin-right:6px}
  .warn{border-color:var(--high);color:var(--high)} .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  input,select,textarea,button{background:#0b0f14;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  textarea{width:100%;min-height:130px;font-family:ui-monospace,monospace} button{background:var(--accent);color:#06121f;border:0;font-weight:600;cursor:pointer}
  label{display:block;margin:8px 0 3px;color:var(--muted);font-size:12px} .err{color:var(--critical);margin-top:8px}
</style></head><body>
<header><a href="/">RAKSHAK</a><span>LLM-assisted SOC alert triage &middot; analyst reviews every alert</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
